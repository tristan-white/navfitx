[project]
name = "navfitx"
description = "Next-generation NAVFIT98A."
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "platformdirs>=4.4.0", 
    "pydantic>=2.11.10",    # <2.12 because of this issue: https://github.com/fastapi/sqlmodel/issues/1623
    "pymupdf>=1.26.6",
    "pyside6>=6.9.3",
    "rich>=14.1.0",
    "sqlmodel>=0.0.27",
    "tomlkit>=0.14.0",
    "typer>=0.19.2",
]

[project.scripts]
navfitx = "navfitx.cli:app"

[project.urls]
Homepage = "https://github.com/tristan-white/navfitx"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "ruff>=0.13.3",
    "ty>=0.0.28",
    "zensical>=0.0.23",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
"navfitx" = ["data/*.pdf"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
style = "pep440"        # also "semver" or "pvp"
pattern = "default"     # "default" requires a "v" prefix; "default-unprefixed" drops it

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
